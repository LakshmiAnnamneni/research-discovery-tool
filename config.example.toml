# Research Discovery Tool configuration. Copy to config.toml and edit.

[search]
# Topic keywords/phrases. Matched in title (3x weight) and abstract.
keywords = ["large language model", "credit risk", "fraud detection", "retrieval-augmented generation"]
exclude   = ["survey", "retracted"]   # drop papers mentioning these
must_have = []                        # every paper must mention all of these
days      = 7                         # look-back window
min_score = 0.35                      # 0..1 relevance threshold
max_papers = 25                       # cap per run (highest scores first)

# ---------------------------------------------------------------------------
# SOURCES: only the [[sources]] blocks below are searched. Nothing runs by
# default. Uncomment and edit the ones you want, or add your own. Each block
# needs a `type`; rss and python sources also need a unique `name`.
# Run a subset with:  python -m rdt run -c config.toml --sources arxiv,my-feed
# ---------------------------------------------------------------------------

# Built-in: arXiv (keyword search). Categories: https://arxiv.org/category_taxonomy
# [[sources]]
# type = "arxiv"
# categories = ["cs.CL", "cs.LG", "q-fin.RM", "q-fin.CP"]   # empty = all
# max_results = 200

# Built-in: bioRxiv / medRxiv (no keyword search; filtered by category, then ranked)
# [[sources]]
# type = "biorxiv"
# categories = ["bioinformatics"]
#
# [[sources]]
# type = "medrxiv"
# categories = ["health informatics"]

# Any RSS / Atom feed: journals, SSRN, chemRxiv, Research Square, a lab's blog ...
# Look for the "RSS" link on the site and paste its URL.
# [[sources]]
# name  = "my-journal"                    # unique; used in paper keys and the contact log
# type  = "rss"
# url   = "https://example.org/feed.xml"
# label = "Journal of Example Studies"    # how the source is named in emails (optional)
# categories = []                          # keep only items tagged with these (optional)
# pdf_url_template = "{url}.full.pdf"      # build a PDF link if the feed has none (optional)

# Your own Python code, for anything without a feed (an internal API, a database ...).
# See examples/my_source.py for the function signature.
# [[sources]]
# name = "my-source"
# type = "python"
# function = "examples/my_source.py:search"   # path relative to this config file

[contacts]
fetch_pdfs = true          # read the PDF's first pages for author emails
max_pages = 3
min_confidence = "medium"  # high | medium | low : how sure we must be the email belongs to the author

[compose]
mode = "template"          # "template" or "llm" (needs ANTHROPIC_API_KEY)
model = "claude-sonnet-5-5"
# Optional custom templates (string.Template placeholders: $salutation $title $title_short
# $source_name $published $url $matched_terms $purpose $ask $sender_name $sender_title
# $sender_org $sender_email $author_name)
# subject_template_file = "templates/subject.txt"
# body_template_file    = "templates/body.txt"

[sender]
name = "Your Name"
title = "Founder"
organization = "Your Firm"
email = "you@yourfirm.com"
salutation_style = "Dr."
purpose = "I lead a technology consulting practice that helps financial-services firms put applied AI research into production."
ask = "set up a short call to hear more about where you plan to take this work"

[outreach]
max_emails_per_run = 10
log_path = "rdt_contact_log.json"   # prevents contacting the same person twice
do_not_contact = []                  # emails or "@domain.edu"
